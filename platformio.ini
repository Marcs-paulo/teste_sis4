; ============================================================
; SIS — Teste 3: Sensor Raso na Zona Radicular (com OTA)
; Placa  : ESP32-C6-DevKitC-1
; Framework: Arduino
; ============================================================

[platformio]
; o botão Upload grava SÓ este env (o de cabo, com segredos)
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
; Fork pioarduino (core arduino-esp32 completo com WiFiClientSecure e C6).
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Placa usa conversor USB-serial CH343 na UART0 (não a USB nativa do C6).
; Por isso NÃO definimos ARDUINO_USB_CDC_ON_BOOT/USB_MODE.

; Particionamento com espaço p/ OTA: min_spiffs dá 2 slots de app de ~1.9MB
; (app0/app1), necessários pra atualização Over-The-Air sem estourar.
board_build.partitions = min_spiffs.csv

lib_deps =
    arduino-libraries/NTPClient @ ^3.2.1
    bblanchon/ArduinoJson @ ^6.21.5

; ── UPLOAD OTA (a distância, pela rede WiFi) ──────────────────
; Depois do PRIMEIRO upload por cabo, atualize sem fio assim:
;   1) descubra o IP da placa (aparece no Serial ao conectar), ou use o
;      hostname "sis-teste3.local";
;   2) rode:  pio run -t upload --upload-port sis-teste3.local
;      (ou o IP).  Senha OTA: a de include/segredos.h.
; Pra forçar OTA sempre, descomente as 3 linhas abaixo:
; upload_protocol = espota
; upload_port     = sis-teste3.local
; upload_flags    = --auth=<senha do segredos.h>

; ── FIRMWARE PÚBLICO (atualização pela internet) ─────────────
; Sem segredos: usa o WiFi/URL já salvos na placa. Gere com
;   pio run -e release
; e suba .pio/build/release/firmware.bin numa release "fw-<FW_VERSAO>" do GitHub.
[env:release]
extends = env:esp32-c6-devkitc-1
build_flags = -DBUILD_PUBLICO
